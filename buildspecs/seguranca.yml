# Fitness functions de segurança: segredos (gitleaks), dependências (npm audit) e código (Semgrep).
# Projeto CodeBuild: gratificai-seguranca.
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 22
    commands:
      - curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      - pip install --quiet semgrep
  build:
    commands:
      - git config --global --add safe.directory "$CODEBUILD_SRC_DIR"
      # Sem o .git o gitleaks varre 0 commits e passa em silencio: aqui o build falha de proposito.
      - git rev-parse --is-inside-work-tree || { echo "ERRO - a origem do pipeline nao esta como Clone completo (Full clone)"; exit 1; }
      # As tres ferramentas rodam sempre; o build so falha no final, com todos os achados no log.
      - |
        FALHA=0
        echo "===== gitleaks (segredos no historico) ====="
        gitleaks git . --redact --verbose || FALHA=1
        echo "===== npm audit (SCA: dependencias de producao) ====="
        (cd mvp && npm audit --omit=dev --audit-level=high) || FALHA=1
        echo "===== Semgrep (SAST: codigo da API e do front) ====="
        semgrep scan --config p/javascript --config p/typescript --severity ERROR --error --metrics=off mvp/server mvp/src || FALHA=1
        test "$FALHA" -eq 0
