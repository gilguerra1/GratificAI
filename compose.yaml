services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gratificai}
      POSTGRES_USER: ${POSTGRES_USER:-gratificai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - gratificai-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/paulocvt/gratificai-api:latest
    build:
      context: ./mvp
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-}
      API_HOST: 0.0.0.0
      API_PORT: 3001
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-gratificai}
      PGUSER: ${POSTGRES_USER:-gratificai}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/paulocvt/gratificai-web:latest
    build:
      context: ./mvp
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  gratificai-postgres-data:
