# Fitness function de qualidade: testes automatizados (vitest com pg-mem) e checagem de tipos/build do front.
# Projeto CodeBuild: gratificai-testes (modo privilegiado: roda o Node 24 num conteiner, a mesma versao das imagens).
version: 0.2

env:
  variables:
    NODE_IMG: public.ecr.aws/docker/library/node:24-bookworm-slim

phases:
  pre_build:
    commands:
      - echo "===== 1/3 npm ci ====="
      - docker run --rm -v "$CODEBUILD_SRC_DIR/mvp":/app -w /app "$NODE_IMG" sh -c "npm ci --include=dev --no-audit --no-fund && npm ls vitest"
  build:
    commands:
      - echo "===== 2/3 testes (vitest) ====="
      - docker run --rm -v "$CODEBUILD_SRC_DIR/mvp":/app -w /app "$NODE_IMG" npm test -- --reporter=default --reporter=junit --outputFile.junit=relatorio-testes.xml
      - echo "===== 3/3 build do front (tsc + vite) ====="
      - docker run --rm -v "$CODEBUILD_SRC_DIR/mvp":/app -w /app "$NODE_IMG" npm run build

reports:
  testes:
    files:
      - mvp/relatorio-testes.xml
    file-format: JUNITXML