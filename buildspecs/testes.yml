# Fitness function de qualidade: testes automatizados (vitest com pg-mem) e checagem de tipos/build do front.
# Projeto CodeBuild: gratificai-testes (modo privilegiado: roda o Node 24 num conteiner, a mesma versao das imagens).
version: 0.2

phases:
  build:
    commands:
      - >-
        docker run --rm -v "$CODEBUILD_SRC_DIR/mvp":/app -w /app
        public.ecr.aws/docker/library/node:24-bookworm-slim
        sh -c "npm ci --no-audit --no-fund
        && npx vitest run --reporter=default --reporter=junit --outputFile.junit=relatorio-testes.xml
        && npm run build"

reports:
  testes:
    files:
      - mvp/relatorio-testes.xml
    file-format: JUNITXML
